; PlatformIO Project Configuration File — CYDEOS
;
; Two board targets, both running the same OS-core + app-shell codebase
; under src/ (no per-board src_dir split like CYD-Voice-Recorder's
; oled_prototype/cyd split — there is no third, unrelated target here).
; Board-specific pins/geometry live in src/boards/board_config.h, selected
; by the BOARD_* macro set in build_flags per env, same pattern as
; CYD-Voice-Recorder. See that project's CLAUDE.md (copied into this repo)
; for the hardware findings behind every one of these settings — nothing
; here should be changed without reading it first.
;
; https://docs.platformio.org/page/projectconf.html

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
test_framework = unity
test_filter = test_embedded
; No OTA, no SPIFFS (SD card is the only storage) — see CLAUDE.md.
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    kosme/arduinoFFT@^2.0.4
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DBOARD_HOSYOND_35
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; 2.8" ESP32-S3 CYD (lcdwiki ES3C28P, internal nickname "CBD") — see
; CLAUDE.md's "Hard-won ES3C28P findings" for the pin table and every
; platform/build-flag choice below.
[env:cyd_es3c28p]
; Pinned, not left to float — see CLAUDE.md (esp-idf#18621: ES8311 mic
; capture via the legacy driver/i2s.h API returns silent/constant samples
; on ESP-IDF 5.5.1+; 7.1.3 bundles IDF 4.4.7). Re-check before bumping.
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Native USB CDC (/dev/ttyACM0), not a CH340 bridge — run `pio device
; list` to confirm before flashing/monitoring.
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    kosme/arduinoFFT@^2.0.4
    h2zero/NimBLE-Arduino@^2.1.0
    https://github.com/pschatzmann/arduino-audio-driver.git
; arduino-audio-driver needs C++17 (constexpr static non-integral data
; members) — see CLAUDE.md.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_ES3C28P
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_INVERSION_ON=1
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

[env:native]
platform = native
test_framework = unity
test_filter = test_native
build_src_filter = -<*>
